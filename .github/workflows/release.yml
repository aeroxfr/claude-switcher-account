# Builds Claude Switcher natively on macOS and Windows, signs the update
# manifest and publishes a GitHub Release.
#
# Trigger: push a tag matching the version in package.json, e.g.
#   git tag v1.0.1 && git push origin v1.0.1
# or run it manually from the "Actions" tab (the tag is then created for you).
#
# Required repository secret: UPDATE_SIGNING_KEY (content of the Ed25519 private
# key generated by `npm run release:keygen`).

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac zip dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  build-win:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the update manifest and publish the release
        run: node scripts/release.js --skip-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
